name: FeinStatic CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, sanitize, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libssl-dev libsqlite3-dev libboost-dev libprotobuf-dev libabsl-dev protobuf-compiler

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Install CometBFT v0.40.0 from source
        run: |
          set -Eeuo pipefail
          COMETBFT_VERSION="v0.40.0"

          # Build CometBFT from the tagged release using Go module verification.
          # Go automatically verifies module checksums against the checksum database.
          go install "github.com/cometbft/cometbft/cmd/cometbft@${COMETBFT_VERSION}"

          # Verify the installed version explicitly.
          INSTALLED_VERSION="$(cometbft version 2>&1 | head -1)"
          echo "Installed CometBFT: ${INSTALLED_VERSION}"
          echo "${INSTALLED_VERSION}" | grep -q "${COMETBFT_VERSION}" || {
            echo "ERROR: CometBFT version mismatch. Expected ${COMETBFT_VERSION}, got: ${INSTALLED_VERSION}" >&2
            exit 1
          }

      - name: Run complete verification matrix
        run: |
          set -Eeuo pipefail
          export COMETBFT_PATH="$(go env GOPATH)/bin/cometbft"
          ./scripts/verify-all.sh

      - name: Validate project records
        run: |
          set -Eeuo pipefail
          bash scripts/validate-project-records.sh
